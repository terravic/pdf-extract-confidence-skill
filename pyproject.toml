[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-extract-confidence"
version = "1.0.0"
description = "PDF text extraction tool with normalized word-level confidence scoring and structured JSON output."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pdfminer.six>=20231228",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
pdf-extract-confidence = "skills.pdf_extract_confidence.scripts.extract_pdf:main"
